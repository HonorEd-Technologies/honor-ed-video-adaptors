<!doctype html>
<html>
  <body style="margin: 0px; background-color: black">
    <div id="player-1"></div>
    <script>
      const videoId = 'VIDEO_ID'
      const enc = 'ENCRYPTED_PAYLOAD'
      const useEducationApi = false // Set to true if you want to use the Education API

      function isAndroid() {
        return typeof HEVideoPlayerBridge !== "undefined";
      }

      function isIOS() {
        return window.webkit && window.webkit.messageHandlers;
      }

      function postToNative(eventName, payload = {}) {
        if (isIOS() && window.webkit.messageHandlers[eventName]) {
          window.webkit.messageHandlers[eventName].postMessage(payload);
        }
        if (isAndroid() && HEVideoPlayerBridge[eventName]) {
          HEVideoPlayerBridge[eventName](...Object.values(payload));
        }
      }

      function getLanguages() {
        if (window.HonorPlayer) {
            const captions = window.HonorPlayer.getAvailableLanguages();
            return captions ? JSON.stringify(captions) : JSON.stringify([]);
        }

        return JSON.stringify([]);
      }

      function getSelectedLanguage() {
          if (window.HonorPlayer) {
              const currentLanguage = window.HonorPlayer.getCurrentLanguage();
              return currentLanguage ? JSON.stringify(currentLanguage) : JSON.stringify({});
          }

          return JSON.stringify({});
      }

      function getAvailablePlaybackRates() {
          if (window.HonorPlayer) {
              const availablePlaybackRates = window.HonorPlayer.getAvailablePlaybackRates();
              return availablePlaybackRates ? JSON.stringify(availablePlaybackRates) : JSON.stringify([]);
          }

          return JSON.stringify([]);
      }

      function getPlaybackRate() {
          if (window.HonorPlayer) {
              const playbackRate = window.HonorPlayer.getPlaybackRate();
              return playbackRate ? JSON.stringify(playbackRate) : JSON.stringify({});
          }

          return JSON.stringify({});
      }

      window.addEventListener('load', (event) => {
        if (!videoId) {
          document.getElementById('player-1').innerText =
            'Please pass in a video id'
        } else {
          let config = {
            height: document.documentElement.clientHeight,
            width: document.documentElement.clientWidth,
            videoId,
            autoplay: false,
            controls: false,
            fullscreenEnabled: false,
            playsInline: false,
            enc,
            useEducationApi,
          }

          const adaptor = HE.HonorVideoAdaptorFactory.createAdaptor('youtube')
          const player = new HE.HonorPlayer('player-1', config, adaptor)
          window.HonorPlayer = player

          player.onReady(() => {
            postToNative("playerReady");
          });

          player.onStateChanged((state) => {
            postToNative("playerStateChanged", { state });
          });

          player.onError((error) => {
            postToNative("playerError", { error });
          });

          player.onCurrentTimeChanged((time) => {
            postToNative("currentTimeChanged", { time });
          });
        }
      })

      window.addEventListener('resize', (event) => {
        const newWidth = document.documentElement.clientWidth
        const newHeight = document.documentElement.clientHeight
        console.log(`resize width: ${newWidth}, height: ${newHeight}`)
        if (window.HonorPlayer) {
          window.HonorPlayer.setSize(newWidth, newHeight)
        }
      })
    </script>
  </body>
</html>
